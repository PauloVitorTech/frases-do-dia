<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases do Dia 💡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <header>
            <h1>Inspiração Diária</h1>
            <p>Clique no botão para descobrir a sua frase de hoje</p>
        </header>

        <main>
            <div class="quote-box">
                <span class="aspas">“</span>
                <p id="quote-text">Clique no botão abaixo para gerar a sua primeira frase inspiradora do dia!</p>
                <span class="aspas fechamento">”</span>
            </div>
            
            <button id="btn-gerar" class="btn">Minha Frase de Hoje</button>
        </main>

        <footer>
            <p>Desenvolvido com 💜 para o GitHub</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
